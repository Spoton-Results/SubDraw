openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SubTracker API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: projects
    description: Project management
  - name: bids
    description: Bid management
  - name: subcontracts
    description: Subcontract management
  - name: changeOrders
    description: Change order management
  - name: invoices
    description: Invoice management
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/update-profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update current user's profile (company name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent (always returns 200 to prevent email enumeration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token

  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List projects for current user
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (GC only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project details
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project details (GC only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /projects/{projectId}/invite:
    post:
      operationId: inviteSubcontractor
      tags: [projects]
      summary: Invite a subcontractor to a project (GC only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/members/{userId}:
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a subcontractor from a project (GC only, BIDDING status)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Subcontractor removed
        "400":
          description: Cannot remove (awarded bid or active subcontract exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/plan-files:
    get:
      operationId: getProjectPlanFiles
      tags: [projects]
      summary: Get plan files for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanFile"
    post:
      operationId: addPlanFile
      tags: [projects]
      summary: Add a plan file to a project (GC only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlanFileRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanFile"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/plan-files/{planFileId}:
    delete:
      operationId: deletePlanFile
      tags: [projects]
      summary: Delete a plan file (GC only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: planFileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/bids:
    get:
      operationId: getProjectBids
      tags: [bids]
      summary: Get bids for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"
    post:
      operationId: submitBid
      tags: [bids]
      summary: Submit a bid (Sub only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBidRequest"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"

  /projects/gc/disputed-invoices:
    get:
      operationId: getGcDisputedInvoices
      tags: [projects]
      summary: Get all disputed invoices across all GC projects (GC only)
      responses:
        "200":
          description: Disputed invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GcDisputedInvoice"

  /projects/{projectId}/bids/{bidId}/award:
    post:
      operationId: awardBid
      tags: [bids]
      summary: Award a bid (GC only) — creates a subcontract
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: bidId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tradeCategory:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Awarded and subcontract created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subcontract"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subcontracts:
    get:
      operationId: getSubcontracts
      tags: [subcontracts]
      summary: List subcontracts for current user
      responses:
        "200":
          description: Subcontracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcontract"

  /subcontracts/{subcontractId}:
    get:
      operationId: getSubcontract
      tags: [subcontracts]
      summary: Get subcontract details with scoreboard
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subcontract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcontractDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subcontracts/{subcontractId}/change-orders:
    get:
      operationId: getChangeOrders
      tags: [changeOrders]
      summary: Get change orders for a subcontract
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Change orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeOrder"
    post:
      operationId: createChangeOrder
      tags: [changeOrders]
      summary: Create a change order (Sub proposes, GC approves)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeOrderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"

  /subcontracts/{subcontractId}/change-orders/{changeOrderId}/approve:
    post:
      operationId: approveChangeOrder
      tags: [changeOrders]
      summary: Approve a change order (GC only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: changeOrderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"

  /subcontracts/{subcontractId}/change-orders/{changeOrderId}/reject:
    post:
      operationId: rejectChangeOrder
      tags: [changeOrders]
      summary: Reject a change order (Sub only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: changeOrderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectChangeOrderRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"

  /subcontracts/{subcontractId}/invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      summary: Get invoices for a subcontract
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: submitInvoice
      tags: [invoices]
      summary: Submit an invoice (Sub only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInvoiceRequest"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /subcontracts/{subcontractId}/invoices/{invoiceId}:
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Cancel and delete a PENDING invoice (Sub only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Invoice is not in PENDING status
        "403":
          description: Forbidden
        "404":
          description: Not found

  /subcontracts/{subcontractId}/invoices/{invoiceId}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Approve an invoice (GC only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /subcontracts/{subcontractId}/invoices/{invoiceId}/reject:
    post:
      operationId: rejectInvoice
      tags: [invoices]
      summary: Reject an invoice (GC only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /subcontracts/{subcontractId}/invoices/{invoiceId}/override:
    post:
      operationId: overrideInvoice
      tags: [invoices]
      summary: Override a flagged invoice with reason (GC only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideInvoiceRequest"
      responses:
        "200":
          description: Overridden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /subcontracts/{subcontractId}/invoices/{invoiceId}/pay:
    post:
      operationId: markInvoicePaid
      tags: [invoices]
      summary: Mark an approved invoice as paid (GC only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAsPaidRequest"
      responses:
        "200":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /subcontracts/{subcontractId}/invoices/{invoiceId}/confirm-payment:
    post:
      operationId: confirmInvoicePayment
      tags: [invoices]
      summary: Sub confirms they received payment (Sub only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /subcontracts/{subcontractId}/invoices/{invoiceId}/dispute-payment:
    post:
      operationId: disputeInvoicePayment
      tags: [invoices]
      summary: Sub disputes that payment was received (Sub only)
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputePaymentRequest"
      responses:
        "200":
          description: Payment disputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /subcontracts/{subcontractId}/invoices/{invoiceId}/pdf:
    get:
      operationId: downloadInvoicePdf
      tags: [invoices]
      summary: Download invoice as PDF
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /subcontracts/{subcontractId}/activity:
    get:
      operationId: getSubcontractActivity
      tags: [subcontracts]
      summary: Get activity log for a subcontract
      parameters:
        - name: subcontractId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogEntry"

  /users:
    get:
      operationId: getUsers
      tags: [auth]
      summary: List all subcontractors (GC use — for inviting)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /contacts:
    get:
      operationId: getContacts
      tags: [contacts]
      summary: Get GC's contact book
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GcContact"

  /contacts/{subId}:
    patch:
      operationId: updateContactNote
      tags: [contacts]
      summary: Update note for a contact
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactNoteRequest"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcContact"
    delete:
      operationId: removeContact
      tags: [contacts]
      summary: Remove a sub from GC's contact book
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /contacts/{subId}/invite/{projectId}:
    post:
      operationId: inviteContactToProject
      tags: [contacts]
      summary: Add an existing contact to a project
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  /profile/me:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get sub's own profile
      responses:
        "200":
          description: Sub profile (null if not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubProfile"
                nullable: true
    put:
      operationId: upsertMyProfile
      tags: [profile]
      summary: Create or update sub's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSubProfileRequest"
      responses:
        "200":
          description: Upserted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubProfile"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    InviteResponse:
      type: object
      properties:
        message:
          type: string
        isNewUser:
          type: boolean
        temporaryPassword:
          type: string
      required: [message, isNewUser]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required: [currentPassword, newPassword]

    UpdateProfileRequest:
      type: object
      properties:
        companyName:
          type: string
      required: [companyName]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
      required: [token, newPassword]

    SubProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        trade:
          type: string
        phone:
          type: string
          nullable: true
        businessAddress:
          type: string
          nullable: true
        licenseNumber:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, trade, createdAt, updatedAt]

    GcContact:
      type: object
      properties:
        id:
          type: string
        gcId:
          type: string
        subId:
          type: string
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sub:
          $ref: "#/components/schemas/User"
        subProfile:
          $ref: "#/components/schemas/SubProfile"
          nullable: true
        sharedProjects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
            required: [id, name]
      required: [id, gcId, subId, createdAt, sub, sharedProjects]

    UpsertSubProfileRequest:
      type: object
      properties:
        trade:
          type: string
        phone:
          type: string
        businessAddress:
          type: string
        licenseNumber:
          type: string
      required: [trade]

    UpdateContactNoteRequest:
      type: object
      properties:
        note:
          type: string
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [GC, SUB]
        companyName:
          type: string
        mustChangePassword:
          type: boolean
        subProfile:
          $ref: "#/components/schemas/SubProfile"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, email, role, companyName, mustChangePassword, createdAt]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [GC, SUB]
        companyName:
          type: string
      required: [email, password, role, companyName]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    ProjectFinancialSummary:
      type: object
      properties:
        subcontractCount:
          type: number
        totalApprovedAmount:
          type: number
        totalInvoiced:
          type: number
        hasFlaggedInvoices:
          type: boolean
        totalCOApproved:
          type: number
        disputedCount:
          type: number
      required: [subcontractCount, totalApprovedAmount, totalInvoiced, hasFlaggedInvoices, totalCOApproved, disputedCount]

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        gcId:
          type: string
        status:
          type: string
          enum: [BIDDING, ACTIVE, CLOSED]
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        estimatedStartDate:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        gc:
          $ref: "#/components/schemas/User"
        financialSummary:
          $ref: "#/components/schemas/ProjectFinancialSummary"
      required: [id, name, gcId, status, createdAt, gc]

    ProjectDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        gcId:
          type: string
        status:
          type: string
          enum: [BIDDING, ACTIVE, CLOSED]
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        estimatedStartDate:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        gc:
          $ref: "#/components/schemas/User"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        bids:
          type: array
          items:
            $ref: "#/components/schemas/Bid"
        subcontracts:
          type: array
          items:
            $ref: "#/components/schemas/Subcontract"
      required: [id, name, gcId, status, createdAt, gc, members, bids, subcontracts]

    ProjectMember:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        userId:
          type: string
        roleOnProject:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [id, projectId, userId, roleOnProject, user]

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        description:
          type: string
        estimatedStartDate:
          type: string
      required: [name]

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        description:
          type: string
        estimatedStartDate:
          type: string
        notes:
          type: string

    InviteRequest:
      type: object
      properties:
        email:
          type: string
        companyName:
          type: string
      required: [email]

    Bid:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        subId:
          type: string
        amount:
          type: number
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, AWARDED, REJECTED]
        scopeOfWorkObjectPath:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sub:
          $ref: "#/components/schemas/User"
      required: [id, projectId, subId, amount, status, createdAt, sub]

    SubmitBidRequest:
      type: object
      properties:
        amount:
          type: number
        notes:
          type: string
        scopeOfWorkObjectPath:
          type: string
          nullable: true
      required: [amount]

    Subcontract:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        subId:
          type: string
        baseContractAmount:
          type: number
        tradeCategory:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        project:
          $ref: "#/components/schemas/Project"
        sub:
          $ref: "#/components/schemas/User"
        scoreboard:
          $ref: "#/components/schemas/Scoreboard"
      required: [id, projectId, subId, baseContractAmount, createdAt, project, sub]

    Scoreboard:
      type: object
      properties:
        base:
          type: number
        coTotal:
          type: number
        currentApprovedTotal:
          type: number
        invoicedTotal:
          type: number
        approvedTotal:
          type: number
        paidTotal:
          type: number
        remaining:
          type: number
        hasFlaggedInvoices:
          type: boolean
        lastInvoice:
          nullable: true
          $ref: "#/components/schemas/Invoice"
      required: [base, coTotal, currentApprovedTotal, invoicedTotal, approvedTotal, paidTotal, remaining, hasFlaggedInvoices]

    SubcontractDetail:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        subId:
          type: string
        baseContractAmount:
          type: number
        tradeCategory:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        project:
          $ref: "#/components/schemas/Project"
        sub:
          $ref: "#/components/schemas/User"
        changeOrders:
          type: array
          items:
            $ref: "#/components/schemas/ChangeOrder"
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        scoreboard:
          $ref: "#/components/schemas/Scoreboard"
      required: [id, projectId, subId, baseContractAmount, createdAt, project, sub, changeOrders, invoices, scoreboard]

    ChangeOrder:
      type: object
      properties:
        id:
          type: string
        subcontractId:
          type: string
        description:
          type: string
        scope:
          type: string
          nullable: true
        amount:
          type: number
        status:
          type: string
          enum: [PENDING_SUB, PENDING_GC, APPROVED, REJECTED]
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, subcontractId, description, amount, status, createdAt, updatedAt]

    CreateChangeOrderRequest:
      type: object
      properties:
        description:
          type: string
        scope:
          type: string
        amount:
          type: number
      required: [description, amount]

    RejectChangeOrderRequest:
      type: object
      properties:
        rejectionReason:
          type: string
      required: []

    Invoice:
      type: object
      properties:
        id:
          type: string
        subcontractId:
          type: string
        invoiceNumber:
          type: string
        amount:
          type: number
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, FLAGGED, PAYMENT_UNCONFIRMED, PAYMENT_CONFIRMED, PAYMENT_DISPUTED]
        flaggedOverAmount:
          type: number
        overrideReason:
          type: string
          nullable: true
        paymentDate:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        paymentReference:
          type: string
          nullable: true
        paymentNotes:
          type: string
          nullable: true
        paymentConfirmedAt:
          type: string
          nullable: true
        disputeReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, subcontractId, invoiceNumber, amount, status, flaggedOverAmount, createdAt, updatedAt]

    SubmitInvoiceRequest:
      type: object
      properties:
        invoiceNumber:
          type: string
        amount:
          type: number
        description:
          type: string
      required: [invoiceNumber, amount]

    OverrideInvoiceRequest:
      type: object
      properties:
        overrideReason:
          type: string
      required: [overrideReason]

    MarkAsPaidRequest:
      type: object
      properties:
        paymentDate:
          type: string
        paymentMethod:
          type: string
          enum: [Check, ACH Transfer, Wire Transfer, Credit Card, Other]
        paymentReference:
          type: string
        paymentNotes:
          type: string
      required: [paymentDate, paymentMethod]

    DisputePaymentRequest:
      type: object
      properties:
        disputeReason:
          type: string

    GcDisputedInvoice:
      type: object
      properties:
        invoiceId:
          type: string
        invoiceNumber:
          type: string
        amount:
          type: number
        disputeReason:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
        projectName:
          type: string
        subcontractId:
          type: string
        subCompanyName:
          type: string
      required: [invoiceId, invoiceNumber, amount, updatedAt, projectId, projectName, subcontractId, subCompanyName]

    PlanFile:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        fileName:
          type: string
          nullable: true
        objectPath:
          type: string
          nullable: true
        fileUrl:
          type: string
          nullable: true
        description:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, description, createdAt]

    AddPlanFileRequest:
      type: object
      properties:
        objectPath:
          type: string
        fileName:
          type: string
        description:
          type: string
      required: [objectPath, fileName, description]

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    ActivityLogEntry:
      type: object
      required: [id, subcontractId, type, description, actorName, actorRole, createdAt]
      properties:
        id:
          type: string
        subcontractId:
          type: string
        type:
          type: string
        description:
          type: string
        actorName:
          type: string
        actorRole:
          type: string
        createdAt:
          type: string
          format: date-time
