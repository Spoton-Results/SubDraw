name: SubDraw security verification

on:
  push:
    branches:
      - fix/payment-route-security
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subdraw-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install pnpm directly with a bounded timeout
        timeout-minutes: 3
        run: |
          node --version
          npm --version
          npm install --global pnpm@10 --registry=https://registry.npmjs.org --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
          pnpm --version
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Run security policy regression tests
        id: policies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @workspace/api-server exec tsx --test tests/auth-sessions.test.ts tests/private-storage.test.ts tests/payment-attempts.test.ts tests/payment-reconciliation.test.ts
      - name: Compile referenced workspace libraries
        id: libraries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck:libs
      - name: Typecheck API source with the actual compiler
        id: api_types
        if: ${{ !cancelled() && steps.libraries.outcome == 'success' }}
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server exec tsc --noEmit --project tsconfig.json 2>&1 | tee "$RUNNER_TEMP/subdraw-api-tsc.log"
      - name: Typecheck frontend source with the actual compiler
        id: frontend_types
        if: ${{ !cancelled() && steps.libraries.outcome == 'success' }}
        run: |
          set -o pipefail
          pnpm --filter @workspace/subtracker exec tsc --noEmit --project tsconfig.json 2>&1 | tee "$RUNNER_TEMP/subdraw-frontend-tsc.log"
      - name: Build API without starting the server
        id: api_build
        if: ${{ !cancelled() && steps.api_types.outcome == 'success' }}
        run: pnpm --filter @workspace/api-server run build
      - name: Build frontend without deployment
        id: frontend_build
        if: ${{ !cancelled() && steps.frontend_types.outcome == 'success' }}
        run: pnpm --filter @workspace/subtracker run build
      - name: Write verification scope and redacted diagnostics
        if: ${{ !cancelled() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          POLICY_RESULT: ${{ steps.policies.outcome }}
          LIBRARY_RESULT: ${{ steps.libraries.outcome }}
          API_TYPES_RESULT: ${{ steps.api_types.outcome }}
          FRONTEND_TYPES_RESULT: ${{ steps.frontend_types.outcome }}
          API_BUILD_RESULT: ${{ steps.api_build.outcome }}
          FRONTEND_BUILD_RESULT: ${{ steps.frontend_build.outcome }}
        run: |
          {
            echo '## SubDraw verification'
            echo "Commit: $GITHUB_SHA"
            echo "Install: $INSTALL_RESULT"
            echo "Security policy tests: $POLICY_RESULT"
            echo "Workspace libraries: $LIBRARY_RESULT"
            echo "API typecheck: $API_TYPES_RESULT"
            echo "Frontend typecheck: $FRONTEND_TYPES_RESULT"
            echo "API build: $API_BUILD_RESULT"
            echo "Frontend build: $FRONTEND_BUILD_RESULT"
            echo ''
            echo '### TypeScript diagnostic locations (messages omitted)'
            for kind in api frontend; do
              log="$RUNNER_TEMP/subdraw-$kind-tsc.log"
              echo "#### $kind"
              if [ -f "$log" ]; then
                matches=$(grep -E '^(src/|artifacts/|lib/)[A-Za-z0-9_./-]+\([0-9]+,[0-9]+\): error TS[0-9]+' "$log" | sed -E 's/^((src\/|artifacts\/|lib\/)[A-Za-z0-9_./-]+\([0-9]+,[0-9]+\): error TS[0-9]+).*/\1/' | sort -u | head -60 || true)
                if [ -n "$matches" ]; then
                  printf '%s\n' '```text' "$matches" '```'
                else
                  echo 'No compiler diagnostic locations captured; inspect the job step for non-TypeScript failures.'
                fi
              else
                echo 'Step did not produce a compiler log.'
              fi
            done
            echo ''
            echo 'This run does not verify database migrations, concurrent API requests, webhook transactions, authorization endpoints, real Stripe behavior, storage configuration, or production readiness.'
            echo 'No deployment, database migration, or live payment action is configured in this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
